name: Deploy AdLedger to GitHub Pages

on:
  push:
    branches: [main, supabase-cloud-sync]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main site
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install main dependencies
        run: npm install

      - name: Build main site
        run: npm run build

      # Build the Supabase branch separately and publish it under /preview/.
      # The main site is always built from main, so preview testing cannot replace it.
      - name: Checkout Supabase test branch
        uses: actions/checkout@v4
        with:
          ref: supabase-cloud-sync
          path: preview-src

      - name: Build Supabase preview
        working-directory: preview-src
        run: |
          npm install
          npx vite build --base=/adledgerr/preview/

      - name: Copy Supabase preview into Pages site
        run: |
          rm -rf ./dist/preview
          mkdir -p ./dist/preview
          cp -R ./preview-src/dist/. ./dist/preview/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy
        uses: actions/deploy-pages@v4
