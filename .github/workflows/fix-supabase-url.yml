name: One-time Supabase URL repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace incorrect Supabase project URL
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/lib/supabase.js')
          s = p.read_text()
          old = 'https://zgyldkvrzmdrvjhtbmcg.supabase.co'
          new = 'https://zgyldkvrzmrdvjhtbmcg.supabase.co'
          if old not in s:
              raise SystemExit('Old URL not found; no change made.')
          p.write_text(s.replace(old, new))
          PY
      - name: Commit repaired URL and remove one-time workflow
        run: |
          rm -f .github/workflows/fix-supabase-url.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/lib/supabase.js .github/workflows/fix-supabase-url.yml
          git commit -m 'Fix Supabase project URL typo for authentication'
          git push
